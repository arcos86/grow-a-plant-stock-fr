
name: Grow a Plant - verifier les releves

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifier stocks.json et historique
        run: python scripts/check_stocks.py

      - name: Enregistrer les changements
        run: |
          git add stocks_status.json stocks_history.json
          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mettre a jour le statut et l'historique"
          git push
